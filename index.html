<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chaty - Kindle Edition</title>
    <style>
        body {
            font-family: sans-serif;
            background-color: #2f3136;
            color: #dcddde;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        #login-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #202225;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .login-card {
            background-color: #36393f;
            padding: 30px;
            border-radius: 8px;
            text-align: center;
            box-shadow: 0 4px 10px rgba(0,0,0,0.3);
        }
        .login-card input {
            padding: 10px;
            font-size: 16px;
            background-color: #202225;
            border: 1px solid #40444b;
            color: white;
            border-radius: 4px;
            margin-bottom: 15px;
            width: 200px;
        }
        .login-card button {
            padding: 10px 20px;
            background-color: #7289da;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .sidebar {
            width: 120px;
            background-color: #202225;
            padding: 10px;
            border-right: 1px solid #2f3136;
        }
        .main-chat {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #36393f;
        }
        .chat-messages {
            flex: 1;
            padding: 15px;
            overflow-y: auto;
        }
        .chat-input-area {
            padding: 15px;
            background-color: #40444b;
            display: flex;
        }
        .chat-input-area input {
            flex: 1;
            padding: 10px;
            background-color: #2f3136;
            border: none;
            color: white;
            font-size: 14px;
        }
        .chat-input-area button {
            padding: 10px 15px;
            background-color: #7289da;
            color: white;
            border: none;
            font-weight: bold;
        }
        .message {
            margin-bottom: 10px;
        }
        .username {
            font-weight: bold;
            color: #7289da;
            margin-right: 5px;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <div class="login-card">
            <h2>Welcome to Chaty</h2>
            <p>Enter a username to start chatting:</p>
            <input type="text" id="username-input" placeholder="Username..." />
            <br>
            <button onclick="joinChat()">Join Chat</button>
        </div>
    </div>

    <div class="sidebar">
        <h3>Servers</h3>
        <div id="server-list"></div>
    </div>

    <div class="main-chat">
        <div class="chat-messages" id="message-container">
            <div class="message"><span class="username">System:</span> Connecting to Chaty server...</div>
        </div>
        <div class="chat-input-area">
            <input type="text" id="chat-input" placeholder="Type a message..." onkeydown="handleKeyDown(event)" />
            <button onclick="sendMessage()">Send</button>
        </div>
    </div>

    <script>
        var currentUser = "";
        var ws;

        function connectWebSocket() {
            var protocol = window.location.protocol === 'https:' ? 'wss://' : 'ws://';
            var wsUrl = protocol + window.location.host;
            ws = new WebSocket(wsUrl);

            ws.onopen = function() {
                appendSystemMessage("Connected to server!");
            };

            ws.onmessage = function(event) {
                var data = JSON.parse(event.data);
                appendChatMessage(data.user, data.text);
            };

            ws.onclose = function() {
                appendSystemMessage("Disconnected from server. Reconnecting...");
                setTimeout(connectWebSocket, 3000);
            };
        }

        function joinChat() {
            var input = document.getElementById('username-input');
            var name = input.value.trim();
            if (!name) return;

            currentUser = name;
            document.getElementById('login-screen').style.display = 'none';
            connectWebSocket();
        }

        function sendMessage() {
            var input = document.getElementById('chat-input');
            var text = input.value.trim();
            if (!text || !currentUser || !ws) return;

            var payload = JSON.stringify({ user: currentUser, text: text });
            ws.send(payload);

            input.value = '';
        }

        function handleKeyDown(event) {
            if (event.key === 'Enter') {
                sendMessage();
            }
        }

        function appendSystemMessage(text) {
            var container = document.getElementById('message-container');
            var div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = '<span class="username">System:</span> ' + text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }

        function appendChatMessage(user, text) {
            var container = document.getElementById('message-container');
            var div = document.createElement('div');
            div.className = 'message';
            div.innerHTML = '<span class="username">' + user + ':</span> ' + text;
            container.appendChild(div);
            container.scrollTop = container.scrollHeight;
        }
    </script>
</body>
</html>
